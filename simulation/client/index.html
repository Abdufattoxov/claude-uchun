<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Civilization</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="topbar">
        <div class="topbar-group">
          <span id="clock">Day 1, 08:00</span>
          <span id="weather-label">clear</span>
        </div>
        <div class="topbar-group">
          <button id="pause-btn">Pause</button>
          <label>Speed
            <select id="speed-select">
              <option value="10">10x</option>
              <option value="30">30x</option>
              <option value="60" selected>60x</option>
              <option value="180">180x</option>
              <option value="600">600x</option>
            </select>
          </label>
          <label>Weather
            <select id="weather-select">
              <option value="clear">Clear</option>
              <option value="cloudy">Cloudy</option>
              <option value="rain">Rain</option>
              <option value="storm">Storm</option>
            </select>
          </label>
        </div>
      </div>

      <div id="inspector" class="hidden">
        <button id="inspector-close">&times;</button>
        <div id="inspector-content"></div>
      </div>

      <div id="admin-panel">
        <h3>Admin: Inject Event</h3>
        <p class="hint">Appears as an unexplained phenomenon. Agents interpret it themselves &mdash; they are never told what it "really" is.</p>
        <textarea id="event-text" rows="2" placeholder="e.g. A glowing symbol appears in the night sky and slowly fades"></textarea>
        <button id="event-submit">Inject</button>
        <div id="event-log"></div>
      </div>

      <div id="agent-list"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
