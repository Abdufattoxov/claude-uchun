<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Shaharchasi</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="topbar">
        <div class="topbar-group">
          <span id="clock">1-kun, 08:00</span>
          <span id="weather-label">ochiq</span>
        </div>
        <div class="topbar-group">
          <button id="pause-btn">Pauza</button>
          <label>Tezlik
            <select id="speed-select">
              <option value="10">10x</option>
              <option value="30">30x</option>
              <option value="60" selected>60x</option>
              <option value="180">180x</option>
              <option value="600">600x</option>
            </select>
          </label>
          <label>Ob-havo
            <select id="weather-select">
              <option value="clear">Ochiq</option>
              <option value="cloudy">Bulutli</option>
              <option value="rain">Yomg'irli</option>
              <option value="storm">Bo'ronli</option>
            </select>
          </label>
        </div>
      </div>

      <div id="civic-panel" title="Shahar aholining o'z mehnati bilan qanchalik rivojlanganini ko'rsatadi">
        <div class="civic-title">Shahar rivojlanishi</div>
        <div id="civic-next" class="muted">...</div>
        <div class="need-bar civic-bar"><i id="civic-bar-fill" style="width:0%"></i></div>
      </div>

      <div id="inspector" class="hidden">
        <button id="inspector-close">&times;</button>
        <div id="inspector-content"></div>
      </div>

      <details id="admin-panel" open>
        <summary>Administrator: Hodisa yuborish</summary>
        <p class="hint">Bu tushuntirib bo'lmaydigan hodisa sifatida namoyon bo'ladi. Aholi uni o'zicha izohlaydi &mdash; ularga bu "aslida nima ekani" hech qachon aytilmaydi.</p>
        <textarea id="event-text" rows="2" placeholder="masalan: Tungi osmonda porlab turgan belgi paydo bo'lib, asta-sekin so'nadi"></textarea>
        <button id="event-submit">Yuborish</button>
        <div id="event-log"></div>
      </details>

      <div id="agent-list"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
